<!doctype html>
<html lang="ku" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BrownStore — کاتالۆگی بەرهەمەکان" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>BrownStore</title>
    <script>
      try {
        var m = document.cookie.match(/(?:^|; )brownstore-theme=([^;]*)/);
        var t = m ? decodeURIComponent(m[1]) : "";
        document.documentElement.setAttribute(
          "data-theme",
          t === "cream" ? "cream" : "espresso"
        );
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "espresso");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
